server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA rewrite — all unknown paths fall through to index.html so React Router
  # can handle client-side routes. Mirrors the render.yaml `routes` block.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite emits hashed asset filenames, so /assets/* is safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Don't cache index.html itself so deploys are picked up on next load.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
  }
}
